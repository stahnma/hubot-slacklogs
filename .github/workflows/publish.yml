name: Publish to npm

# Publishes when a GitHub release is published. The release tag must match
# the version in package.json (e.g. v0.1.0 for version 0.1.0).
#
# Uses npm trusted publishing (OIDC), so no NPM_TOKEN secret is needed.
# Configure the trusted publisher once at
# https://www.npmjs.com/package/hubot-slacklogs/access
# (repository: stahnma/hubot-slacklogs, workflow: publish.yml).

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json $version"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm publish
